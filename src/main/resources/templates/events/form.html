<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 680px;">
    <div class="page-header">
        <h1 th:text="${pageTitle}"></h1>
        <p class="text-muted">
            Club: <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}"></a>
        </p>
    </div>

    <form th:action="${formAction}" th:object="${eventForm}" method="post" novalidate>
        <!-- HTTP method override for PUT -->
        <input type="hidden" name="_method" th:if="${httpMethod == 'PUT'}" value="PUT"/>

        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label">
                Name <span class="text-danger">*</span>
            </label>
            <input type="text" id="name" th:field="*{name}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="Event name"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label for="date" class="form-label">
                Date <span class="text-danger">*</span>
            </label>
            <input type="date" id="date" th:field="*{date}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}"
                 th:errors="*{date}"></div>
        </div>

        <!-- Event Type -->
        <div class="mb-3">
            <label for="type" class="form-label">
                Event Type <span class="text-danger">*</span>
            </label>
            <select id="type" th:field="*{type}"
                    class="form-select"
                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                <option value="">— Select type —</option>
                <option th:each="t : ${allTypes}"
                        th:value="${t.name}"
                        th:text="${t.name}">
                </option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}"
                 th:errors="*{type}"></div>
        </div>

        <!-- Location (optional) -->
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <div class="input-group">
                <input type="text" id="location" name="location" th:field="*{location}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                       placeholder="e.g. Room A101 (optional)"/>
                <button type="button" class="btn btn-outline-info" id="check-weather-js">Check Weather JS</button>
                <button type="button" class="btn btn-outline-info" 
                        hx-get="/api/weather" 
                        hx-include="#location"
                        hx-target="#weather-result">Check Weather HTMX</button>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            <div id="weather-result" class="mt-2"></div>
        </div>

        <!-- Description (optional) -->
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" th:field="*{description}"
                      class="form-control" rows="4"
                      placeholder="Optional description..."></textarea>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save Event</button>
            <a th:href="@{/clubs/{id}(id=${club.id})}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnJs = document.getElementById('check-weather-js');
        const locationInput = document.getElementById('location');
        const weatherResult = document.getElementById('weather-result');

        if(btnJs) {
            btnJs.addEventListener('click', () => {
                const loc = locationInput.value;
                if(!loc) return;
                fetch(`/api/weather?location=${encodeURIComponent(loc)}`, {
                    headers: { 'Accept': 'application/json' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.raining === true) {
                        weatherResult.innerHTML = '<span class="badge bg-warning text-dark">Raining</span>';
                    } else if (data.raining === false) {
                        weatherResult.innerHTML = '<span class="badge bg-success">Clear</span>';
                    } else {
                        weatherResult.innerHTML = '<span class="text-secondary">Weather data unavailable.</span>';
                    }
                })
                .catch(err => {
                    weatherResult.innerHTML = '<span class="text-danger">Error fetching weather</span>';
                });
            });
        }
    });
</script>
</body>
</html>
