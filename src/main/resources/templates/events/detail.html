<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${event.name})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 720px;">
    <div class="page-header">
        <h1 th:text="${event.name}"></h1>
        <span th:text="${event.type.name}" class="badge badge-type text-bg-secondary mb-3"></span>
    </div>

    <dl class="row">
        <dt class="col-sm-3">Date</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></dd>

        <dt class="col-sm-3">Location</dt>
        <dd class="col-sm-9" th:text="${event.location ?: '—'}"></dd>

        <dt class="col-sm-3">Club</dt>
        <dd class="col-sm-9">
            <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}"></a>
        </dd>

        <dt class="col-sm-3" th:if="${event.description != null}">Description</dt>
        <dd class="col-sm-9" th:if="${event.description != null}" th:text="${event.description}"></dd>
    </dl>

    <div class="mt-4 d-flex gap-2">
        <a th:href="@{/clubs/{cid}/events/{eid}/edit(cid=${club.id}, eid=${event.id})}"
           class="btn btn-primary">Edit</a>
        <a th:href="@{/clubs/{cid}/events/{eid}/delete(cid=${club.id}, eid=${event.id})}"
           class="btn btn-danger">Delete</a>
        <a th:href="@{/clubs/{id}(id=${club.id})}"
           class="btn btn-outline-secondary">&larr; Back to Club</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
