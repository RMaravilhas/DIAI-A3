<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('All Events')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="page-header">
        <h1>All Events</h1>
    </div>

    <!-- Filter Form -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">Filter Events</div>
        <div class="card-body">
            <form method="get" th:action="@{/events}" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="filterType" class="form-label">Event Type</label>
                    <select id="filterType" name="type" class="form-select">
                        <option value="" th:selected="${selectedType == null}">All types</option>
                        <option th:each="t : ${allTypes}"
                                th:value="${t}"
                                th:text="${t}"
                                th:selected="${selectedType == t}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterClub" class="form-label">Club</label>
                    <select id="filterClub" name="clubId" class="form-select">
                        <option value="" th:selected="${selectedClubId == null}">All clubs</option>
                        <option th:each="club : ${clubs}"
                                th:value="${club.id}"
                                th:text="${club.name}"
                                th:selected="${selectedClubId == club.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterFrom" class="form-label">From</label>
                    <input id="filterFrom" type="date" name="from" class="form-control"
                           th:value="${selectedFrom}"/>
                </div>
                <div class="col-md-2">
                    <label for="filterTo" class="form-label">To</label>
                    <input id="filterTo" type="date" name="to" class="form-control"
                           th:value="${selectedTo}"/>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/events}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Events Table -->
    <div th:if="${events.empty}" class="alert alert-info">
        No events match your filters.
    </div>

    <table th:unless="${events.empty}" class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Club</th>
            <th>Date</th>
            <th>Type</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td>
                <a th:href="@{/clubs/{cid}/events/{eid}(cid=${event.clubId}, eid=${event.id})}"
                   th:text="${event.name}"></a>
            </td>
            <td>
                <a th:href="@{/clubs/{id}(id=${event.clubId})}"
                   th:text="${clubMap[event.clubId]?.name ?: 'Unknown'}">
                </a>
            </td>
            <td th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></td>
            <td>
                <span th:text="${event.type}" class="badge badge-type text-bg-secondary"></span>
            </td>
            <td th:text="${event.location ?: '—'}"></td>
            <td>
                <a th:href="@{/clubs/{cid}/events/{eid}/edit(cid=${event.clubId}, eid=${event.id})}"
                   class="btn btn-sm btn-outline-primary me-1">Edit</a>
                <a th:href="@{/clubs/{cid}/events/{eid}/delete(cid=${event.clubId}, eid=${event.id})}"
                   class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
