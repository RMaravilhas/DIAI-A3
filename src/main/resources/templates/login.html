<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4 text-center">Nova Events Sign In</h2>
            
            <div th:if="${loginError}" class="alert alert-danger" role="alert">
                Invalid username and password.
            </div>
            
            <form th:action="@{/login}" method="post" class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 pb-2">Sign In</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
