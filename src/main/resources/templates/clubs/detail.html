<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${club.name})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="page-header">
        <h1 th:text="${club.name}"></h1>
        <span th:text="${club.category}"
              class="badge badge-category mb-3"
              th:classappend="${
                  club.category.name() == 'TECHNOLOGY' ? 'text-bg-primary' :
                  club.category.name() == 'ARTS'       ? 'text-bg-warning' :
                  club.category.name() == 'SPORTS'     ? 'text-bg-success' :
                  club.category.name() == 'ACADEMIC'   ? 'text-bg-info' :
                  club.category.name() == 'SOCIAL'     ? 'text-bg-secondary' :
                                                          'text-bg-dark'
              }">
        </span>
        <p class="lead" th:text="${club.description}"></p>
    </div>

    <div class="mb-4">
        <a th:href="@{/events(clubId=${club.id})}" class="btn btn-outline-secondary me-2">View Events</a>
        <a th:href="@{/clubs/{id}/events/new(id=${club.id})}" class="btn btn-success">+ Add Event</a>
    </div>

    <h2 class="h4 mb-3">Events</h2>

    <div th:if="${events.empty}" class="alert alert-info">
        No events yet for this club. Be the first to <a th:href="@{/clubs/{id}/events/new(id=${club.id})}">add one</a>!
    </div>

    <table th:unless="${events.empty}" class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Type</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td>
                <a th:href="@{/clubs/{cid}/events/{eid}(cid=${club.id}, eid=${event.id})}"
                   th:text="${event.name}"></a>
            </td>
            <td th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></td>
            <td>
                <span th:text="${event.type}" class="badge badge-type text-bg-secondary"></span>
            </td>
            <td th:text="${event.location ?: '—'}"></td>
            <td>
                <a th:href="@{/clubs/{cid}/events/{eid}/edit(cid=${club.id}, eid=${event.id})}"
                   class="btn btn-sm btn-outline-primary me-1">Edit</a>
                <a th:href="@{/clubs/{cid}/events/{eid}/delete(cid=${club.id}, eid=${event.id})}"
                   class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/clubs}" class="btn btn-outline-secondary btn-sm">&larr; Back to Clubs</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
