<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Campus Clubs')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="page-header">
        <h1>Campus Clubs</h1>
    </div>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Events</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="club : ${clubs}">
            <td th:text="${club.name}" class="fw-semibold"></td>
            <td>
                <span th:text="${club.category}"
                      class="badge badge-category"
                      th:classappend="${
                          club.category.name() == 'TECHNOLOGY' ? 'text-bg-primary' :
                          club.category.name() == 'ARTS'       ? 'text-bg-warning' :
                          club.category.name() == 'SPORTS'     ? 'text-bg-success' :
                          club.category.name() == 'ACADEMIC'   ? 'text-bg-info' :
                          club.category.name() == 'SOCIAL'     ? 'text-bg-secondary' :
                                                                  'text-bg-dark'
                      }">
                </span>
            </td>
            <td class="events-count" th:text="${club.events.size()}"></td>
            <td>
                <details>
                    <summary th:text="${#strings.abbreviate(club.description, 50)}"></summary>
                    <p class="mt-2 text-muted" th:text="${club.description}"></p>
                </details>
            </td>
            <td>
                <a th:href="@{/clubs/{id}(id=${club.id})}" class="btn btn-sm btn-primary">View Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
