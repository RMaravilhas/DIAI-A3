spring.application.name=novaevents
spring.mvc.hiddenmethod.filter.enabled=true
weather.api.key=dummy-key

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/novaevents?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=novaevents_user
spring.datasource.password=novaevents_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL query logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
